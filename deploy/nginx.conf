server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hardening básico (el TLS termina en Cloudflare delante del tunnel)
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # API de Supabase via Kong (mismo origen: sin CORS). El prefijo ^~ evita
    # que el regex de assets capture paths como /storage/v1/object/x.png.
    location ^~ /rest/v1/ {
        proxy_pass http://kong:8000/rest/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /auth/v1/ {
        proxy_pass http://kong:8000/auth/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /realtime/v1/ {
        proxy_pass http://kong:8000/realtime/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /storage/v1/ {
        proxy_pass http://kong:8000/storage/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker y runtime de workbox SIEMPRE frescos (autoUpdate
    # depende de detectar cambios en sw.js; cachearlo rompería las updates)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/workbox-[^/]+\.js$ {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta interna sirve index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con cache largo (hash en nombre)
    location ~* \.(js|css|woff2?|png|jpg|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No cachear index.html (siempre la versión fresca del SPA).
    # Re-declara los security headers: add_header en una location anula
    # los heredados del server.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
